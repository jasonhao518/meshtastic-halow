name: Build and push Heltec HC33 HaLow

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch/tag/commit to build from (defaults to workflow default ref)."
        required: false
        default: ""
        type: string
      target:
        description: "Target env to build, for example heltec-hc33-halow."
        required: true
        default: heltec-hc33-halow
        type: string
      platform:
        description: "Platform for target env (for example esp32s3)."
        required: true
        default: esp32s3
        type: string
      release_tag:
        description: "Target release tag in edge-device-esp32 (for example v2.7.15.abcdef). Leave empty to use current local version."
        required: false
        type: string

permissions: read-all

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          token: ${{ github.token }}
      - id: resolve
        name: Resolve version and release tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v$(./bin/buildinfo.py long)"
          fi
          VERSION="${TAG#v}"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/build_firmware.yml
    secrets: inherit
    with:
      version: ${{ needs.resolve.outputs.version }}
      pio_env: ${{ inputs.target }}
      platform: ${{ inputs.platform }}
      git_ref: ${{ inputs.branch || github.ref_name }}

  push:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
      - name: Download built firmware
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-${{ inputs.platform }}-${{ inputs.target }}-${{ needs.resolve.outputs.version }}
          merge-multiple: true
          path: ./output
      - name: Package release asset
        run: |
          cd output
          zip -j -9 -r ../${{ inputs.target }}-${{ needs.resolve.outputs.version }}.zip .
      - name: Push to edge-device-esp32 release
        env:
          TARGET_REPO: meshtastic/edge-device-esp32
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.EDGE_DEVICE_ESP32_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" ./${{ inputs.target }}-${{ needs.resolve.outputs.version }}.zip --repo "$TARGET_REPO" --clobber
