name: Build and Push heltec-hc33-halow (merged) via internal workflow

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Source branch to build"
        required: false
        default: main
      target:
        description: "Target environment"
        required: false
        default: heltec-hc33-halow
      platform:
        description: "Platform string"
        required: false
        default: esp32s3
      release_tag:
        description: "Release tag to upload (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    env:
      TARGET_RELEASE_REPO: edgez-ai/edge-device-esp32

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive

      - name: Set up Python and dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install -U platformio esptool

      - name: Build merged heltec-hc33-halow binary
        run: |
          set -euo pipefail
          ./bin/build-merged-firmware.sh ${{ inputs.target }} ${{ inputs.platform }}

      - name: Package merged binary as meshtastic.bin
        id: package
        run: |
          set -euo pipefail
          VERSION="$(./bin/buildinfo.py long)"
          BASE="firmware-${{ inputs.target }}-${VERSION}"
          WEB_BIN="release/${BASE}-web.bin"

          if [[ ! -f "$WEB_BIN" ]]; then
            echo "::error::Expected merged web image not found at ${WEB_BIN}"
            exit 1
          fi

          cp "$WEB_BIN" release/meshtastic.bin
          echo "firmware=release/meshtastic.bin" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="${{ inputs.release_tag }}"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$VERSION"
          fi
          RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload merged binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: heltec-hc33-halow-merged-${{ steps.package.outputs.release_tag }}
          path: ${{ steps.package.outputs.firmware }}
          if-no-files-found: error
          retention-days: 30

      - name: Check publish token availability
        id: publish_guard
        run: |
          if [ -z "${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}" ]; then
            echo "publish_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GH_PERSONAL_ACCESS_TOKEN is not set. Skipping publish to ${TARGET_RELEASE_REPO}."
          else
            echo "publish_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify target repository access
        if: steps.publish_guard.outputs.publish_enabled == 'true'
        run: |
          if ! git ls-remote --exit-code "https://x-access-token:${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}@github.com/${TARGET_RELEASE_REPO}.git" HEAD >/dev/null 2>&1; then
            echo "::error::GH_PERSONAL_ACCESS_TOKEN cannot access ${TARGET_RELEASE_REPO} (need Contents: Write and org SSO authorization if required)."
            exit 1
          fi

      - name: Push merged bin to edge-device-esp32 release
        if: steps.publish_guard.outputs.publish_enabled == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.TARGET_RELEASE_REPO }}
          token: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          tag_name: ${{ steps.package.outputs.release_tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.firmware }}
