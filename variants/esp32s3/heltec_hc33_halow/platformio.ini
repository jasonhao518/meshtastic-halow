[env:heltec-hc33-halow]
; HW_MODEL: using PRIVATE_HW (255) until a SEEED_XIAO_S3_HT_HC33 slot is allocated upstream.
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3_HT_HC33
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Xiao ESP32-S3 + Heltec HT-HC33
custom_meshtastic_tags = Seeed, Heltec, HaLow, Experimental
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = seeed-xiao-s3

; Morse Micro mm-iot-esp32 requires ESP-IDF 5.1.x; PlatformIO's default
; espressif32 platform ships IDF 4.4.7. Override with the pioarduino fork +
; vidplace7's v5.1 framework artifact (same combination the ESP32-C6 variant
; uses). This unlocks IDF 5.1 driver APIs (spi_master, gpio) at the cost of
; some Arduino-ESP32 2.x APIs that aren't in 3.x — expect to compile-fix
; downstream callers.
platform =
  https://github.com/Jason2866/platform-espressif32/archive/22faa566df8c789000f8136cd8d0aca49617af55.zip
platform_packages =
  framework-arduinoespressif32 @ https://github.com/vidplace7/platform-espressif32/releases/download/meshtastic-esp32c6/framework-arduinoespressif32-all-release_v5.1-124d64e.zip

board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600

build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=1
  -DHAS_UDP_MULTICAST=1

build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3_HT_HC33
  -I variants/esp32s3/heltec_hc33_halow
  -I third_party/mm-iot-esp32/framework/morselib/include
  -I third_party/mm-iot-esp32/framework/mm_shims/include/esp32s3
  -I third_party/mm-iot-esp32/framework/src/mmregdb
  -I third_party/mm-iot-esp32/framework/src/mmutils
  -I third_party/mm-iot-esp32/framework/src/mmpktmem
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  ; Compile the HaLow raw-MAC transport into the firmware.
  ; NimBLE-Arduino 1.4.3 (pinned in esp32-common.ini) doesn't compile against
  ; IDF 5.1, so disable Bluetooth on this variant for now. Phone API remains
  ; available over serial.
  -DHAS_BLUETOOTH=0
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
  -DHAS_WIFI=0
  ; The v5.1 framework already adds --specs=nano.specs; tell esp32_extra.py
  ; to skip its own addition or the linker fails on a duplicate spec.
  -DMESHTASTIC_SKIP_NANO_SPECS=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  ; No I2C peripherals on this HaLow-only stack. Skipping just the rescan path
  ; is enough — main.cpp's I2C scan is already gated on HAS_WIRE which we set
  ; to 0. We avoid MESHTASTIC_EXCLUDE_I2C because InputBroker.cpp
  ; unconditionally references cardKbI2cImpl.
  -DI2C_NO_RESCAN=1
  -DUSE_HALOW_RADIO=1
  -DUSE_MM_IOT_ESP32=1
  ; Pin map fed to the vendored Morse HAL. These are the ESP32-S3 GPIOs wired
  ; to the Heltec HT-HC33 module's SPI/control pins.
  -DCONFIG_MM_RESET_N=8
  -DCONFIG_MM_WAKE=9
  -DCONFIG_MM_BUSY=7
  -DCONFIG_MM_SPI_SCK=4
  -DCONFIG_MM_SPI_MOSI=3
  -DCONFIG_MM_SPI_MISO=5
  -DCONFIG_MM_SPI_CS=2
  -DCONFIG_MM_SPI_IRQ=6
  -DCONFIG_MM_SPI_FREQ_HZ=20000000
  -DCONFIG_MM_SPI_HOST=2
  -DCONFIG_MM_BCF_FILE=\"bcf_mf08551.mbin\"
  -DCONFIG_MM_FW_FILE=\"mm6108.mbin\"
  -DMMPKTMEM_TX_POOL_N_BLOCKS=20
  -DMMPKTMEM_RX_POOL_N_BLOCKS=23
  ; 802.11ah mesh discovery uses Meshtastic's LoRa region, primary channel
  ; name, and primary channel PSK. No AP/IP path is used.
  -DHALOW_MESH_SCAN_DWELL_MS=120
  ; lib/MorseWlan builds a wrapper archive from third_party/mm-iot-esp32 on demand.

lib_ignore =
  ${esp32_common.lib_ignore}
  NimBLE-Arduino
  libpax

build_src_filter =
  ${esp32_common.build_src_filter} -<mesh/http>
