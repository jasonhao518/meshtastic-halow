CONFIG_NETWORKING=y
CONFIG_NET_TX_STACK_SIZE=768
CONFIG_NET_RX_STACK_SIZE=768
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=4
CONFIG_NET_DHCPV4=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL_MAX=1
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1024

CONFIG_WIFI=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_WIFI_MORSE_SM=y
# Meshtastic uses morselib directly for 802.11ah mesh frames, matching the
# HC33 path, instead of binding the Morse chip to Zephyr's net_if path.
CONFIG_WIFI_MORSE_TEST=y
CONFIG_WIFI_MORSE_REGION="US"
CONFIG_WIFI_MORSE_BCF="bcf_HC01.mbin"

CONFIG_SHELL=n
CONFIG_NET_SHELL=n
CONFIG_SPI_LOG_LEVEL_WRN=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_SHA512=y
CONFIG_MBEDTLS_ENTROPY_C=y
CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CMAC=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_CTR_DRBG_ENABLED=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_ECDH_C=y
CONFIG_MBEDTLS_ECDSA_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
CONFIG_MBEDTLS_PKCS5_C=y
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_halow_config.h"

CONFIG_MMPKTMEM_TX_POOL_N_BLOCKS=6
CONFIG_MMPKTMEM_RX_POOL_N_BLOCKS=8
